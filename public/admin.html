<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Support queue · AI Support Desk</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/admin.html">
      <svg aria-hidden="true"><use href="/icons/sprite.svg#logo"/></svg>
      <span>AI Support Desk<small class="role-tag">IT staff console</small></span>
    </a>
    <div class="header-actions">
      <button class="btn btn-secondary" id="install-btn" type="button" hidden>
        <svg class="icon" aria-hidden="true"><use href="/icons/sprite.svg#download"/></svg><span>Install app</span></button>
      <span class="user-chip" id="user-chip"></span>
      <button class="btn btn-ghost btn-icon" id="signout-btn" type="button" aria-label="Sign out" title="Sign out">
        <svg class="icon" aria-hidden="true"><use href="/icons/sprite.svg#logout"/></svg></button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1 id="view-title">Support queue</h1>
        <p class="muted" id="view-sub">Sorted by urgency: highest priority first, then oldest.</p>
      </div>
      <nav class="seg" aria-label="Admin sections">
        <a href="#queue" id="nav-queue" aria-current="page">Queue</a>
        <a href="#users" id="nav-users">Users</a>
      </nav>
    </div>

    <section id="queue-view" aria-label="Ticket queue">
      <div class="stats" id="stats">
        <div class="card stat"><div class="num" id="stat-open">–</div><div class="lbl">Open</div></div>
        <div class="card stat"><div class="num" id="stat-progress">–</div><div class="lbl">In progress</div></div>
        <div class="card stat urgent"><div class="num" id="stat-urgent">–</div><div class="lbl">Urgent (P4–P5)</div></div>
        <div class="card stat ai"><div class="num" id="stat-ai">–</div><div class="lbl">Answered by AI</div></div>
      </div>

      <div class="filters">
        <div class="field grow">
          <label for="f-search" class="sr-only">Search</label>
          <input class="input" id="f-search" type="search" placeholder="Search subject, text, or username">
        </div>
        <div class="field">
          <label for="f-status" class="sr-only">Status</label>
          <select class="input" id="f-status">
            <option value="">Status</option>
            <option value="open">Open</option><option value="in_progress">In progress</option>
            <option value="ai_resolved">Answered by AI</option><option value="pending_ai">AI reviewing</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="field">
          <label for="f-category" class="sr-only">Category</label>
          <select class="input" id="f-category">
            <option value="">Category</option>
            <option value="billing">Billing</option><option value="technical">Technical</option>
            <option value="account">Account</option><option value="general">General</option><option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="f-queue" class="sr-only">Queue</label>
          <select class="input" id="f-queue">
            <option value="">Queue</option>
            <option value="billing">Billing</option><option value="technical">Technical</option>
            <option value="account">Account</option><option value="general">General</option>
          </select>
        </div>
      </div>

      <div class="queue-card card-desktop">
        <table class="queue" id="queue">
          <thead><tr><th>Priority</th><th>Ticket</th><th>Category</th><th>Queue</th><th>Status</th><th>Age</th></tr></thead>
          <tbody id="queue-body"></tbody>
        </table>
      </div>
    </section>

    <section id="users-view" aria-label="Users" hidden>
      <div class="card table-wrap">
        <table class="user-table">
          <thead><tr><th>Username</th><th class="hide-sm">Joined</th><th>Role</th></tr></thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
    <div class="drawer-inner">
      <header class="drawer-head">
        <div>
          <p class="muted small" id="drawer-id"></p>
          <h2 id="drawer-title">Ticket</h2>
          <div class="badges" id="drawer-badges"></div>
        </div>
        <button class="btn btn-ghost btn-icon" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="/icons/sprite.svg#x"/></svg></button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
      <footer class="drawer-foot" id="drawer-foot"></footer>
    </div>
  </dialog>
</body>
</html>
