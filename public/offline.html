<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563EB">
  <title>Offline · AI Support Desk</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="center-page">
    <div class="card">
      <svg class="icon" aria-hidden="true"><use href="/icons/sprite.svg?v=2#wifi-off"/></svg>
      <h1>You're offline</h1>
      <p class="muted">This page isn't saved on your device yet. Reconnect to the internet and try again.</p>
      <button class="btn" type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
